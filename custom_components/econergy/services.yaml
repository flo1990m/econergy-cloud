set_program_day:
  name: Enregistrer le programme Econergy
  description: Modifie les créneaux d'un jour, les consignes Éco/Confort, ou les deux pour un radiateur Econergy.
  fields:
    device_id:
      name: Identifiant du radiateur
      description: Identifiant API du radiateur (utilisé automatiquement par la carte).
      required: true
      selector:
        text:
    day:
      name: Jour
      description: Jour de la semaine à modifier (à fournir avec periods).
      required: false
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    periods:
      name: Créneaux Confort
      description: Liste de zéro à trois objets contenant start et end au format HH:MM (à fournir avec day).
      required: false
      selector:
        object:
    eco_c:
      name: Consigne Éco
      description: Consigne Éco entre 13 et 19 °C, par pas de 0,5 °C.
      required: false
      selector:
        number:
          min: 13
          max: 19
          step: 0.5
          unit_of_measurement: °C
    comfort_c:
      name: Consigne Confort
      description: Consigne Confort entre 13,5 et 30 °C, par pas de 0,5 °C.
      required: false
      selector:
        number:
          min: 13.5
          max: 30
          step: 0.5
          unit_of_measurement: °C
