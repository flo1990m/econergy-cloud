name: Build Econergy integration ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build econergy.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify integration version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/econergy/manifest.json", encoding="utf-8"))["version"])')"
          test "$VERSION" = "2.1.4"
          echo "Building Econergy Cloud $VERSION"

      - name: Create integration ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd custom_components/econergy
          zip -r "$GITHUB_WORKSPACE/econergy.zip" . -x "*.pyc" "__pycache__/*" ".DS_Store"
          cd "$GITHUB_WORKSPACE"
          test -s econergy.zip
          unzip -l econergy.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: econergy-2.1.4
          path: econergy.zip
          if-no-files-found: error
          retention-days: 30
